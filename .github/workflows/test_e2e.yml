name: Suita QA Automata OrangeHRM

# Când se declanșează acest pipeline? (Trigger)
on:
  push:
    branches: [ main ] # Rulează automat de fiecare dată când trimitem cod nou pe ramura main
  pull_request:
    branches: [main]

jobs:
  executie-teste:
    runs-on: ubuntu-latest # Sistemul de operare împrumutat de la GitHub
    
    steps:
    - name: 1. Aducem codul din repository
      uses: actions/checkout@v4

    - name: 2. Instalam mediul Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. Instalam librariile (Pytest & Playwright)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Instalam browserul ascuns (Chromium)
      run: playwright install chromium

    - name: 5. Rulam suita de teste E2E
      # ATENȚIE: Verifică dacă fișierul tău se numește test_suite.py sau test_suita.py
      # În comanda de mai jos am pus test_suite.py cum am văzut în poza ta anterioară.
      run: pytest test_suite.py --html=raport_final.html --self-contained-html

    - name: 6. Salvam Raportul HTML (Artifact)
      uses: actions/upload-artifact@v4
      if: always() # Salvează raportul chiar dacă un test din cele 5 a picat
      with:
        name: Raport-Testare-QA
        path: raport_final.html
        retention-days: 7
  # Al doilea job: porneste DOAR daca testele au trecut (needs)
  build-imagine:
    needs: executie-teste
    runs-on: ubuntu-latest
    permissions:
      contents: read     # poate citi codul
      packages: write    # poate publica imagini in GHCR

    steps:
    - name: 1. Aducem codul din repository
      uses: actions/checkout@v4

    - name: 2. Pregatim Docker Buildx (constructorul de imagini)
      uses: docker/setup-buildx-action@v3

    - name: 3. Login in GHCR (doar pe main)
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}   # token temporar, creat automat de GitHub

    - name: 4. Construim imaginea (o publicam doar pe main)
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}   # PR = doar build; main = build + publicare
        tags: |
          ghcr.io/iulik47/proiect_qa:${{ github.sha }}
          ghcr.io/iulik47/proiect_qa:latest
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
